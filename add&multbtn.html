<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function displayaddTwo(){
            var num1 = parseInt(document.getElementById("n1").value);
         var num2 = parseInt(document.getElementById("n2").value);
         var add =num1+num2;
         document.getElementById("n3").value=add;
        }
        function displayaMultiplyTwo(){
            var num1 = parseInt(document.getElementById("n1").value);
         var num2 = parseInt(document.getElementById("n2").value);
         var mul =num1*num2;
         document.getElementById("n3").value=mul;
        }
    </script>
</head>
<body>
    <label>Enter Num1 :</label>
    <input type="text" placeholder="Num1" id="n1"><br>
    <label>Enter Num2 :</label>
    <input type="text" placeholder="Num1" id="n2"><br>
    <label>Result :</label>
    <input type="text" placeholder="Num1+Num2" id="n3"><br>
    <button onclick="displayaddTwo()">Add</button>
    <button onclick="displayaMultiplyTwo()">Multiply</button>
</body>
</html>
